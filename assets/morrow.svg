<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="Morrow — Your private AI workspace">
  <defs>
    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1f2e;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#e8a87c;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#f0c070;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#e8a87c;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1a1f2e;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c070;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#e8a87c;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" style="stop-color:#f5d08a;stop-opacity:0.5"/>
      <stop offset="60%" style="stop-color:#e8905a;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5ede0"/>
      <stop offset="100%" style="stop-color:#c8b49a"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sunBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
    <clipPath id="bgClip">
      <rect width="760" height="220" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="760" height="220" rx="16" fill="#0d1117"/>

  <!-- Starfield -->
  <g opacity="0.35" clip-path="url(#bgClip)">
    <circle cx="60" cy="28" r="1" fill="#e8d5b0"/>
    <circle cx="140" cy="14" r="0.8" fill="#e8d5b0"/>
    <circle cx="220" cy="38" r="1.2" fill="#e8d5b0"/>
    <circle cx="310" cy="18" r="0.7" fill="#e8d5b0"/>
    <circle cx="390" cy="32" r="1" fill="#e8d5b0"/>
    <circle cx="470" cy="12" r="0.9" fill="#e8d5b0"/>
    <circle cx="540" cy="44" r="1.1" fill="#e8d5b0"/>
    <circle cx="620" cy="22" r="0.8" fill="#e8d5b0"/>
    <circle cx="700" cy="36" r="1" fill="#e8d5b0"/>
    <circle cx="90" cy="55" r="0.7" fill="#e8d5b0"/>
    <circle cx="260" cy="60" r="0.9" fill="#e8d5b0"/>
    <circle cx="430" cy="50" r="0.8" fill="#e8d5b0"/>
    <circle cx="590" cy="58" r="1" fill="#e8d5b0"/>
    <circle cx="730" cy="48" r="0.7" fill="#e8d5b0"/>
    <circle cx="30" cy="70" r="1.1" fill="#e8d5b0"/>
    <circle cx="180" cy="75" r="0.6" fill="#e8d5b0"/>
    <circle cx="350" cy="68" r="0.9" fill="#e8d5b0"/>
    <circle cx="510" cy="72" r="1" fill="#e8d5b0"/>
    <circle cx="670" cy="62" r="0.8" fill="#e8d5b0"/>
  </g>

  <!-- Sun glow halo -->
  <ellipse cx="380" cy="178" rx="200" ry="90" fill="url(#sunGlow)" clip-path="url(#bgClip)"/>
  <ellipse cx="380" cy="178" rx="80" ry="36" fill="#f5c060" opacity="0.08" filter="url(#sunBlur)" clip-path="url(#bgClip)"/>

  <!-- Rising sun semicircle -->
  <path d="M 330 178 A 50 50 0 0 1 430 178 Z" fill="#f5d080" opacity="0.92" filter="url(#softGlow)" clip-path="url(#bgClip)"/>

  <!-- Horizon line -->
  <rect x="0" y="178" width="760" height="1.5" fill="url(#horizonGrad)" clip-path="url(#bgClip)"/>

  <!-- Horizon glow beam -->
  <rect x="0" y="155" width="760" height="24" fill="url(#glowGrad)" clip-path="url(#bgClip)" opacity="0.6"/>

  <!-- Reflection ripples -->
  <g opacity="0.18" clip-path="url(#bgClip)">
    <ellipse cx="380" cy="191" rx="120" ry="3.5" fill="#f0c060"/>
    <ellipse cx="380" cy="200" rx="72" ry="2.5" fill="#f0c060"/>
    <ellipse cx="380" cy="207" rx="40" ry="1.8" fill="#f0c060"/>
  </g>

  <!-- Wordmark -->
  <text
    x="380"
    y="156"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="74"
    font-weight="700"
    letter-spacing="14"
    text-anchor="middle"
    fill="url(#textGrad)"
    filter="url(#softGlow)"
  >MORROW</text>

  <!-- Tagline -->
  <text
    x="380"
    y="210"
    font-family="'Courier New', 'Menlo', 'Monaco', monospace"
    font-size="11.5"
    font-weight="400"
    letter-spacing="3.5"
    text-anchor="middle"
    fill="#7a6e60"
    opacity="0.9"
  >YOUR PRIVATE AI WORKSPACE</text>

  <!-- Border -->
  <rect width="760" height="220" rx="16" fill="none" stroke="#2a2520" stroke-width="1.5"/>
</svg>
